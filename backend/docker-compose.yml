services:
  minio:
    container_name: s3backup-minio
    image: minio/minio:latest
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console (http://localhost:9001)
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - "./.minio-data:/data"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  elasticmq:
    container_name: s3backup-elasticmq
    image: softwaremill/elasticmq-native:latest
    ports:
      - "9324:9324"   # SQS-compatible HTTP API
      - "9325:9325"   # Optional admin UI

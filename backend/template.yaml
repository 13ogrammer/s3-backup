AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  s3-backup backend. Provides pre-signed S3 URLs (upload, download, delete,
  move) and bucket listing to the mobile app. Deploy this to your own AWS
  account; your photo/video bytes never traverse this backend.

Parameters:
  BootstrapToken:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: >
      Shared secret the mobile app uses to authenticate to this API.
      Use at least 32 random characters (e.g. `openssl rand -hex 32`).
      Paste the same value into the app's Settings screen.
  BucketName:
    Type: String
    Default: ''
    Description: >
      Name of an existing S3 bucket to back up to. Leave blank to have this
      stack create a new bucket with versioning and public-access-block on.
  CreateReleaseBucket:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      Set to "true" to provision a public-read S3 bucket for hosting APK
      releases and the version manifest JSON consumed by the in-app
      "update available" banner. Only the maintainer publishing APK
      releases needs this — fork users downloading APKs should leave it
      "false". DANGER: everything in this bucket is world-readable; only
      put release artifacts there (manifest.json, signed APKs), never
      anything else.
  MaxFilesPerJob:
    Type: Number
    Default: 10000
    Description: >
      Maximum number of files allowed in a single folder-move job.
      Folders larger than this are rejected with HTTP 422.
  WorkerParallelism:
    Type: Number
    Default: 16
    Description: >
      Number of concurrent S3 copy/delete operations the MoveWorker runs per
      batch. Higher values finish large jobs faster but increase S3 request
      rates. Default 16 is a safe starting point for most buckets.

Conditions:
  CreateBucket: !Equals [!Ref BucketName, '']
  CreateReleases: !Equals [!Ref CreateReleaseBucket, 'true']

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 29
    MemorySize: 1024
    Architectures: [arm64]
    Environment:
      Variables:
        BOOTSTRAP_TOKEN: !Ref BootstrapToken
        BUCKET_NAME: !If [CreateBucket, !Ref BackupBucket, !Ref BucketName]
        MAX_FILES_PER_JOB: !Ref MaxFilesPerJob

Resources:
  BackupBucket:
    Type: AWS::S3::Bucket
    Condition: CreateBucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUpload
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      MetricsConfigurations:
        - Id: EntireBucket

  ReleaseBucket:
    Type: AWS::S3::Bucket
    Condition: CreateReleases
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: false
        IgnorePublicAcls: true
        RestrictPublicBuckets: false

  ReleaseBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: CreateReleases
    Properties:
      Bucket: !Ref ReleaseBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadGet
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub 'arn:aws:s3:::${ReleaseBucket}/*'

  FolderMoveQueue:
    Type: AWS::SQS::Queue
    Properties:
      # VisibilityTimeout must exceed MoveWorker timeout (900 s) + buffer.
      VisibilityTimeout: 950
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt FolderMoveDLQ.Arn
        maxReceiveCount: 1

  FolderMoveDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600  # 14 days

  VideoTranscodeQueue:
    Type: AWS::SQS::Queue
    Properties:
      # VisibilityTimeout must exceed TranscodeWorker timeout (900 s) + buffer.
      VisibilityTimeout: 950
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt VideoTranscodeDLQ.Arn
        maxReceiveCount: 1

  VideoTranscodeDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600  # 14 days

  ApiFn:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: src/
      Handler: index.handler
      Environment:
        Variables:
          FOLDER_MOVE_QUEUE_URL: !Ref FolderMoveQueue
          VIDEO_TRANSCODE_QUEUE_URL: !Ref VideoTranscodeQueue
      Policies:
        - Statement:
            - Sid: BucketAccess
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:DeleteObject
                - s3:ListBucket
              Resource:
                - !Sub
                  - 'arn:aws:s3:::${B}'
                  - B: !If [CreateBucket, !Ref BackupBucket, !Ref BucketName]
                - !Sub
                  - 'arn:aws:s3:::${B}/*'
                  - B: !If [CreateBucket, !Ref BackupBucket, !Ref BucketName]
            - Sid: CloudWatchMetrics
              Effect: Allow
              Action:
                - cloudwatch:GetMetricStatistics
              Resource: '*'
            - Sid: SqsSendMessage
              Effect: Allow
              Action:
                - sqs:SendMessage
              Resource:
                - !GetAtt FolderMoveQueue.Arn
                - !GetAtt VideoTranscodeQueue.Arn
      Events:
        ApiRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: ANY
            Path: /{proxy+}

  MoveWorker:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: src/
      Handler: worker.handler
      # Worker can run up to 15 minutes per job. Each SQS message is one job.
      Timeout: 900
      MemorySize: 1024
      # Limit concurrency to avoid saturating S3 request rates on large buckets.
      ReservedConcurrentExecutions: 4
      Environment:
        Variables:
          WORKER_PARALLELISM: !Ref WorkerParallelism
      Events:
        SqsTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt FolderMoveQueue.Arn
            BatchSize: 1
      Policies:
        - Statement:
            # s3:CopyObject is not a separate IAM action — it requires
            # s3:GetObject on the source and s3:PutObject on the destination.
            - Sid: BucketAccess
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:DeleteObject
                - s3:ListBucket
              Resource:
                - !Sub
                  - 'arn:aws:s3:::${B}'
                  - B: !If [CreateBucket, !Ref BackupBucket, !Ref BucketName]
                - !Sub
                  - 'arn:aws:s3:::${B}/*'
                  - B: !If [CreateBucket, !Ref BackupBucket, !Ref BucketName]
            - Sid: SqsWorkerAccess
              Effect: Allow
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
                - sqs:ChangeMessageVisibility
              Resource: !GetAtt FolderMoveQueue.Arn

  TranscodeWorker:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: src/
      Handler: transcodeWorker.handler
      # 15-minute ceiling; very long videos (>~2 h) may hit this and DLQ.
      # Acceptable v1 limitation — documented in ARCHITECTURE.md.
      Timeout: 900
      # 3 GB RAM to give ffmpeg headroom for 4K source frames.
      MemorySize: 3008
      # 4 GB ephemeral storage for downloading original + writing preview in /tmp.
      EphemeralStorage:
        Size: 4096
      # Limit concurrent transcode invocations to avoid excessive S3/Lambda cost spikes.
      ReservedConcurrentExecutions: 2
      Events:
        SqsTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt VideoTranscodeQueue.Arn
            BatchSize: 1
      Policies:
        - Statement:
            - Sid: BucketAccess
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:HeadObject
              Resource:
                - !Sub
                  - 'arn:aws:s3:::${B}/*'
                  - B: !If [CreateBucket, !Ref BackupBucket, !Ref BucketName]
            - Sid: SqsWorkerAccess
              Effect: Allow
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
                - sqs:ChangeMessageVisibility
              Resource: !GetAtt VideoTranscodeQueue.Arn

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      FailOnWarnings: true

  ObservabilityDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${AWS::StackName}-observability'
      DashboardBody: !Sub
        - |
          {
            "widgets": [
              {
                "type": "metric", "x": 0, "y": 0, "width": 8, "height": 6,
                "properties": {
                  "title": "Lambda Invocations",
                  "metrics": [["AWS/Lambda", "Invocations", "FunctionName", "${ApiFn}"]],
                  "stat": "Sum", "period": 300, "view": "timeSeries", "region": "${AWS::Region}"
                }
              },
              {
                "type": "metric", "x": 8, "y": 0, "width": 8, "height": 6,
                "properties": {
                  "title": "Lambda Errors",
                  "metrics": [["AWS/Lambda", "Errors", "FunctionName", "${ApiFn}"]],
                  "stat": "Sum", "period": 300, "view": "timeSeries", "region": "${AWS::Region}"
                }
              },
              {
                "type": "metric", "x": 16, "y": 0, "width": 8, "height": 6,
                "properties": {
                  "title": "Lambda Duration p95",
                  "metrics": [["AWS/Lambda", "Duration", "FunctionName", "${ApiFn}"]],
                  "stat": "p95", "period": 300, "view": "timeSeries", "region": "${AWS::Region}"
                }
              },
              {
                "type": "metric", "x": 0, "y": 6, "width": 8, "height": 6,
                "properties": {
                  "title": "API Gateway 4xx",
                  "metrics": [["AWS/ApiGateway", "4xx", "ApiId", "${Api}"]],
                  "stat": "Sum", "period": 300, "view": "timeSeries", "region": "${AWS::Region}"
                }
              },
              {
                "type": "metric", "x": 8, "y": 6, "width": 8, "height": 6,
                "properties": {
                  "title": "API Gateway 5xx",
                  "metrics": [["AWS/ApiGateway", "5xx", "ApiId", "${Api}"]],
                  "stat": "Sum", "period": 300, "view": "timeSeries", "region": "${AWS::Region}"
                }
              },
              {
                "type": "metric", "x": 16, "y": 6, "width": 8, "height": 6,
                "properties": {
                  "title": "S3 GET Requests",
                  "metrics": [["AWS/S3", "GetRequests", "BucketName", "${BucketRef}", "FilterId", "EntireBucket"]],
                  "stat": "Sum", "period": 300, "view": "timeSeries", "region": "${AWS::Region}"
                }
              },
              {
                "type": "metric", "x": 0, "y": 12, "width": 8, "height": 6,
                "properties": {
                  "title": "S3 PUT Requests",
                  "metrics": [["AWS/S3", "PutRequests", "BucketName", "${BucketRef}", "FilterId", "EntireBucket"]],
                  "stat": "Sum", "period": 300, "view": "timeSeries", "region": "${AWS::Region}"
                }
              }
            ]
          }
        - BucketRef: !If [CreateBucket, !Ref BackupBucket, !Ref BucketName]

Outputs:
  ApiUrl:
    Description: Base URL to paste into the mobile app's Settings screen
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com'
  BucketName:
    Description: Name of the S3 bucket this stack will back up to
    Value: !If [CreateBucket, !Ref BackupBucket, !Ref BucketName]
  ReleaseBucketName:
    Condition: CreateReleases
    Description: Public bucket name for hosting APK releases and manifest.json
    Value: !Ref ReleaseBucket
  ReleaseManifestUrl:
    Condition: CreateReleases
    Description: >
      Base URL for the release bucket. Paste this + "/manifest.json" into
      VERSION_MANIFEST_URL in app/lib/version.ts.
    Value: !Sub 'https://${ReleaseBucket}.s3.${AWS::Region}.amazonaws.com'
